<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fathy El Sayed | Décolis</title>
<meta property="og:image" content="og.jpg"><meta name="description" content="Fathy El Sayed, cofondateur et directeur de Décolis, rénovation intérieure à Paris. CV et présentation de l'entreprise en français et en anglais.">
<link rel="alternate" hreflang="fr" href="#fr"><link rel="alternate" hreflang="en" href="#en">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, crafted, personal; a tradesman's portfolio, not a corporate brochure
   IDEA: an architect's elevation sheet of a renovated Paris room
   PICTURE: line drawing of a Haussmann interior: tall window, mouldings, library wall, herringbone parquet
   COLOUR and TYPE: charcoal ground, warm stone paper, brass accent; Lora titles, Inter text
   LAYOUT: dark hero band with drawing, paper sections, download cards, dark contact band */
:root{color-scheme:light dark;--bg:light-dark(#FFFCF5,#171310);--paper2:light-dark(#F6EBC8,#221A14);--ink:light-dark(#1E1C1A,#EEE8DF);
--soft:light-dark(#5E5852,#AFA79C);--line:light-dark(#DDD5CA,#36322D);--brass:light-dark(#962609,#E8A48E);--dark:#7A1E07;--darkink:#F2ECE3}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:500;line-height:1.08;text-wrap:balance;margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(5vw,18px)}
header{position:sticky;top:0;z-index:5;background:var(--dark);color:var(--darkink);border-bottom:1px solid #8F2A10}
.bar{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.wm{font-family:Lora,serif;letter-spacing:.2em;font-size:19px;text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:12px}
nav{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}nav a{text-decoration:none;opacity:.8}nav a:hover{opacity:1}
.lang{display:flex;border:1px solid #A84A30;border-radius:30px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:0 14px;min-height:36px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#F3DCCF}
.lang button[aria-pressed=true]{background:#F6EBC8;color:#7A1E07}
.lang button:focus-visible,.btn:focus-visible,.dl a:focus-visible{outline:2px solid #F6EBC8;outline-offset:2px}
.hero{background:var(--dark);color:var(--darkink);padding:clamp(36px,6vw,80px) 0 0}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,4vw,56px);align-items:end}
.hp{width:132px;height:132px;border-radius:50%;object-fit:cover;border:2px solid #F6EBC8;padding:4px;margin-bottom:22px;display:block}
.hero h1{font-size:clamp(40px,6vw,64px)}
.role{margin-top:14px;font-size:18px;color:#F6EBC8}
.hero p{font-size:17px;color:#F3DCCF;max-width:34em;margin:18px 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:clamp(30px,5vw,64px)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:40px;text-decoration:none;font-weight:600;font-size:15px}
.btn.p{background:#F6EBC8;color:#7A1E07}.btn.s{border:1px solid #B3533A;color:var(--darkink)}
.btn svg{width:16px;height:16px}
.fig{position:relative;aspect-ratio:1.1/1;max-height:470px;width:100%}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.draw path,.draw rect,.draw line{stroke-dasharray:1400;stroke-dashoffset:1400;animation:d 2.6s ease forwards}
@keyframes d{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.draw path,.draw rect,.draw line{animation:none;stroke-dashoffset:0}}
section.band{padding:clamp(40px,6vw,88px) 0;border-bottom:1px solid var(--line)}
.label{font-size:14px;color:var(--brass);font-weight:600;margin-bottom:12px}
h2{font-size:clamp(30px,4vw,44px);margin-bottom:22px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(24px,5vw,72px)}
.lead{font-family:Lora,serif;font-size:clamp(19px,2.2vw,23px);line-height:1.5}
.facts{display:grid;gap:18px;align-content:start}
.facts div{border-top:1px solid var(--line);padding-top:12px}
.facts b{display:block;font-size:14px;color:var(--brass);font-weight:600;margin-bottom:6px}
.facts span{display:block;font-size:15px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.tl .dt{color:var(--brass);font-weight:600;font-size:14px;white-space:nowrap;padding-top:4px}
.tl h3{font-size:22px}.tl .org{color:var(--soft);font-size:15px;margin:4px 0 8px}
.tl ul{margin:0;padding-left:18px;color:var(--ink)}.tl ul li{display:list-item;border:0;padding:3px 0}
.tl ul li::marker{color:var(--brass)}
.co{background:var(--paper2)}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 32px;margin:34px 0 46px}
.svc div{border-top:1px solid var(--line);padding-top:14px}
.svc b{display:block;font-family:Lora,serif;font-size:20px;font-weight:500;margin-bottom:6px}
.svc p{margin:0;color:var(--soft);font-size:15px}
.ap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.ap div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px}
.ap b{display:block;margin-bottom:6px}.ap p{margin:0;color:var(--soft);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chips span{border:1px solid var(--line);border-radius:30px;padding:6px 14px;font-size:14px;background:var(--bg)}
.dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:28px}
.dl a{display:flex;flex-direction:column;gap:30px;justify-content:space-between;min-height:190px;padding:22px;border:1px solid var(--line);
border-radius:16px;text-decoration:none;background:var(--bg);transition:transform .2s,border-color .2s}
.dl a:hover{transform:translateY(-3px);border-color:var(--brass)}
.dl .k{font-size:13px;font-weight:600;color:var(--brass)}.dl .t{font-family:Lora,serif;font-size:20px;line-height:1.25}
.dl .m{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft)}
.contact{background:var(--dark);color:var(--darkink);padding:clamp(44px,6vw,90px) 0}
.cgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:end}
.contact h2{color:var(--darkink)}.contact p{color:#F3DCCF;margin:0}
.cl{display:grid;gap:12px;font-size:17px}.cl a{text-decoration:none;border-bottom:1px solid #A84A30;padding:10px 0;display:flex;justify-content:space-between;gap:12px}
.cl small{color:#E2B6A6;font-size:13px}
footer{background:var(--dark);color:#D08A72;font-size:13px;padding:22px 0;border-top:1px solid #8F2A10}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:900px){.hgrid,.two,.cgrid{grid-template-columns:minmax(0,1fr)}.svc{grid-template-columns:repeat(2,minmax(0,1fr))}
.ap,.dl{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{max-height:380px}nav{display:none}}
@media(max-width:600px){.svc,.ap,.dl{grid-template-columns:minmax(0,1fr)}.tl li{grid-template-columns:minmax(0,1fr);gap:4px}.dl a{min-height:150px}}
html{scroll-padding-top:72px;scroll-behavior:smooth}
</style></head><body>
